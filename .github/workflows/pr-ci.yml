name: Pull Request CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  pre-commit-check:
    name: Pre-commit check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then python -m pip install -r backend/requirements.txt; fi

      - name: Validate backend Python syntax
        run: python -m compileall backend

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Build frontend
        run: |
          cd frontend
          npm run build

  security-vulnerability-check:
    name: Security vulnerability check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Run npm audit
        run: |
          cd frontend
          npm audit --audit-level=moderate

      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit

      - name: Run pip audit
        run: |
          if [ -f backend/requirements.txt ]; then python -m pip_audit; fi

  docs-build-and-deploy:
    name: Documentation build and deploy
    runs-on: ubuntu-latest
    needs: pre-commit-check
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Validate documentation files
        run: |
          if [ ! -d docs ]; then echo "Documentation directory not found" && exit 1; fi
          find docs -type f | grep -E '\.(md|markdown)$' || (echo "No documentation markdown files found" && exit 1)

      - name: Package documentation artifact
        uses: actions/upload-artifact@v5
        with:
          name: documentation
          path: docs

  build-artifacts:
    name: Create build artifacts
    runs-on: ubuntu-latest
    needs: [pre-commit-check, docs-build-and-deploy]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v5
        with:
          name: frontend-build
          path: frontend/dist
