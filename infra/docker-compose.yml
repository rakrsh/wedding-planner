version: "3.9"

services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: wedding
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  mongo:
    image: mongo:6
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"

  keycloak:
    image: quay.io/keycloak/keycloak:22.0.3
    restart: unless-stopped
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
    command: ["start-dev", "--http-port=8080"]
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak-realm.json:/opt/keycloak/data/import/wedding-realm.json:ro
    environment:
      KC_IMPORT: /opt/keycloak/data/import/wedding-realm.json

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - postgres
      - mongo
      - redis
      - keycloak
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/wedding
      MONGO_URL: mongodb://mongo:27017
      REDIS_URL: redis://redis:6379/0
      KEYCLOAK_JWKS_URL: http://keycloak:8080/auth/realms/wedding-planner/protocol/openid-connect/certs
      OAUTH_AUDIENCE: wedding-planner-api

volumes:
  postgres-data:
  mongo-data:
